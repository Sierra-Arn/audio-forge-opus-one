# Originally from Score Forge for Opus One
# https://github.com/Sierra-Arn/score-forge-opus-one
# Modified for Audio Forge for Opus One

# recipes/musescore/recipe.yaml

package:
    name: musescore
    version: 3.7.0

# ==================================================================================================

source:
    # MuseScore 3 Evolution (Jojo-Schmitz). Lands in the work-directory root.
    - git: https://github.com/Jojo-Schmitz/MuseScore.git
      rev: 785b15e56a25b85187a6d1d1b760bc453095fbec
    # MuseScore General HQ extension (MUSFE.muxt v1.2.0). .muxt is zip but not
    # auto-extracted by rattler; build.sh unpacks the sf3 into share/sound/.
    - url: https://s3.amazonaws.com/extensions.musescore.org/3.6/extensions/MUSFE.muxt
      sha256: c84b3135fc643138533fbdb31757bb91887002b2fc7d234c1b8b0e15bdb21815
      file_name: MUSFE.muxt
      target_directory: musfe

# ==================================================================================================

build:
    number: 1
    script: build.sh

requirements:
    build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - cmake >=4.4.3,<5
        - make >=4.4.1,<5
        - pkg-config >=0.29.2,<0.30
        - git >=2.55.0,<3
        - coreutils >=9.0,<10
        - unzip >=6.0,<7
    host:
        - qt-main >=5.15.15,<6
        - libsndfile >=1.2.2,<2
        - lame >=3.100,<4
        - freetype >=2.14.3,<3
        - fontconfig >=2.18.3,<3
        - libpng >=1.6.58,<2
        - zlib >=1.3.2,<2
        - portaudio >=19.7.0,<20
        - portmidi >=2.0.8,<3
        - alsa-lib >=1.2.16.1,<2
        - pulseaudio >=17.0,<18
        - libvorbis >=1.3.7,<2
        - libogg >=1.3.5,<2
        - libgl >=1.7.0,<2
        - libgl-devel >=1.7.0,<2
        - libglvnd >=1.7.0,<2
        - libglvnd-devel >=1.7.0,<2
        - libglu >=9.0.3,<10
        - mesalib >=24.3.4,<24.4
        - xorg-xorgproto >=2025.1,<2026
        - xorg-libx11 >=1.8.13,<2
        - xorg-libxcb >=1.12,<2
        - xorg-libxrandr >=1.5.5,<2
        - xorg-libxcursor >=1.2.3,<2
        - xorg-libxi >=1.8.3,<2
        - xorg-libxrender >=0.9.12,<0.10
        - xorg-libxtst >=1.2.5,<2
        - xcb-util >=0.4.1,<0.5
        - xcb-util-wm >=0.4.2,<0.5
        - xcb-util-image >=0.4.0,<0.5
        - xcb-util-keysyms >=0.4.1,<0.5
        - xcb-util-renderutil >=0.3.10,<0.4
        - libxkbcommon >=1.13.2,<2
        - xkeyboard-config >=2.48,<3
        - dbus >=1.16.2,<2
        - openssl >=3.5.5,<4
    run:
        - libgl >=1.7.0,<2
        - libglvnd >=1.7.0,<2
        - xkeyboard-config >=2.48,<3

# ==================================================================================================

about:
    homepage: https://github.com/Jojo-Schmitz/MuseScore
    repository: https://github.com/Jojo-Schmitz/MuseScore
    summary:  Music notation and composition software
    license: GPL-2.0-only
    description: |
        Packaged from Jojo-Schmitz/MuseScore branch 3.x
        (commit 785b15e56a25b85187a6d1d1b760bc453095fbec).
        Ships MuseScore General HQ as the default soundfont.

# ==================================================================================================
