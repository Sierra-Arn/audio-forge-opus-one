# recipes/scripts/pyproject.toml

[project]
name = "scripts"
version = "0.1.0"
description = "CLIs for Audio Forge for Opus One"
license = "Apache-2.0"
authors = [{ name = "Sierra Arn", email = "unweariedheart@gmail.com" }]
dependencies = []

[project.scripts]
fetch-mscz-scores = "scripts.fetch_mscz_scores:main"
normalize-loudness = "scripts.normalize_loudness:main"
measure-loudness = "scripts.measure_loudness:main"
reverb = "scripts.reverb.main:main"
write-flac-metadata = "scripts.write_flac_metadata:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scripts"]
